<style>

    <span id="stat"></span>

  <div class="row filters" data-in-cards>

    <select id="fRar"><option value="">全部稀有度</option></select>
    <select id="fLv"><option value="">全部等级</option><option>1</option><option>2</option><option>3</option></select>

</header>

const LS_KEY="imsnake_cards_v5";
let db={meta:{version:5,note:""},cards:[],snake:{},monsters:{},npcs:{},drops:{}};

function migrateCard(c){
  if(c.vals&&!c.params){c.params={x:{1:c.vals[1]||0,2:c.vals[2]||0,3:c.vals[3]||0}};delete c.vals;}
  if(!c.params)c.params={};
  if(c.note===undefined)c.note="";
  return c;
}
function migrateMonsters(ms){
  Object.values(ms).forEach(m=>{
    if(!Array.isArray(m.drops)){
      const n=+m.drops||0;
      m.drops=n?[{id:"bean",count:n}]:[];
    }
  });
  return ms;
}
function load(){
  let source="默认配置",hadData=false;
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){db=JSON.parse(raw);hadData=true;source="本地存档";}
    else{
      for(const oldKey of["imsnake_cards_v4","imsnake_cards_v3","imsnake_cards_v2"]){
        const old=localStorage.getItem(oldKey);
        if(old){db=JSON.parse(old);hadData=true;source="迁移自旧版";try{localStorage.removeItem(oldKey);}catch(e){}break;}
      }
    }
  }catch(e){showErr("读取存档失败："+e.message);db=null;}
  if(!db||typeof db!=="object")db={};
  if(!Array.isArray(db.cards))db.cards=[];
  db.cards=db.cards.map(migrateCard);
  db.snake=Object.assign({},DEFAULT_SNAKE,db.snake||{});
  db.monsters=migrateMonsters(Object.assign({},DEFAULT_MONSTERS,db.monsters||{}));
  db.npcs=Object.assign({},DEFAULT_NPCS,db.npcs||{});
  db.drops=Object.assign({},DEFAULT_DROPS,db.drops||{});
  delete db.interact;
  if(!db.cards.length){db.cards=JSON.parse(JSON.stringify(DEFAULT_CARDS));source=hadData?"存档卡牌为空，已恢复默认":"默认配置";}
  try{localStorage.setItem(LS_KEY,JSON.stringify(db));}catch(e){showErr("写入存档失败："+e.message);}
  document.getElementById("srcStatus").textContent="来源："+source+" · "+db.cards.length+" 张卡";
}
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(db));}catch(e){showErr("保存失败："+e.message);return;}
  toast("已保存");
}
function rarById(id){return RARS.find(r=>r.id===id)||RARS[0];}
function catName(id){return CATS[id]||id;}
function cardById(id){return db.cards.find(c=>c.id===id);}
function id2name(id){const c=cardById(id);return c?c.name:id;}
function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function fmt(v){return v===undefined?"—":(Math.abs(v)<1?+v.toFixed(3):v);}
function subDesc(c){let s=c.desc||"";for(const n of Object.keys(c.params||{})){const v=(c.params[n]||{})[c.lv];s=s.split("{"+n+"}").join(fmt(v));}return s;}
function parSummary(c){return Object.keys(c.params||{}).map(n=>{const p=(c.params[n]||{});return "<em>"+esc(n)+"</em> Lv1 "+fmt(p[1])+" ｜ Lv2 "+fmt(p[2])+" ｜ Lv3 "+fmt(p[3]);}).join("<br>");}

function linkList(ids,type){
  return (ids||[]).map(id=>"<a data-id='"+id+"'>"+esc(id2name(id))+"</a>").join("")||"—";
}
function bindCardLinks(root){
  root.querySelectorAll("a[data-id]").forEach(a=>a.onclick=()=>showCardPopup(a.getAttribute("data-id")));
}

/* ============ 卡牌页 ============ */
function render(){
  try{
    const cat=el("fCat").value,rar=el("fRar").value,lv=el("fLv").value,q=el("fSearch").value.toLowerCase();
    const list=db.cards.filter(c=>
      (!cat||c.cat===cat)&&(!rar||c.rar===rar)&&(!lv||String(c.lv)===lv)&&
      (!q||(c.name+c.desc).toLowerCase().includes(q)||(c.pre||[]).concat(c.mut||[]).some(x=>id2name(x).toLowerCase().includes(q)))
    ).sort((a,b)=>RAR_ORDER[a.rar]-RAR_ORDER[b.rar]||a.name.localeCompare(b.name));
    const box=el("list");box.innerHTML="";
    if(!list.length){box.innerHTML="<div class='empty'>没有匹配的卡牌</div>";}
    list.forEach(c=>{
      const R=rarById(c.rar);
      const d=document.createElement("div");
      d.className="card";d.style.setProperty("--rr",R.color);
      d.innerHTML=
        "<div class='top'><h3>"+esc(c.name)+"</h3>"+
        "<span class='badge b-rar' style='background:"+R.color+"'>"+R.name+"</span>"+
        "<span class='badge b-cat'>"+catName(c.cat)+"</span>"+
        "<span class='badge b-lv'>Lv"+c.lv+"</span></div>"+
        "<div class='desc'>"+esc(subDesc(c))+"</div>"+
        (c.note?"<div class='note'>📝 "+esc(c.note)+"</div>":"")+
        "<div class='pars'>"+parSummary(c)+"</div>"+
        "<div class='links'>前置："+linkList(c.pre)+"<br>互斥："+linkList(c.mut)+"</div>"+
        "<div class='ops'><button type='button' data-edit='"+c.id+"'>编辑</button><button type='button' class='del' data-del='"+c.id+"'>删除</button></div>";
      box.appendChild(d);
    });
    bindCardLinks(box);
    box.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openModal(b.getAttribute("data-edit")));
    box.querySelectorAll("[data-del]").forEach(b=>b.onclick=function(){
      const c=cardById(this.getAttribute("data-del"));
      if(!confirm("删除「"+(c?c.name:"?")+"」？"))return;
      db.cards=db.cards.filter(x=>x.id!==this.getAttribute("data-del"));
      db.cards.forEach(x=>{x.pre=(x.pre||[]).filter(p=>p!==this.getAttribute("data-del"));x.mut=(x.mut||[]).filter(p=>p!==this.getAttribute("data-del"));});
      save();render();
    });
    updateStat();
  }catch(e){showErr("渲染失败："+e.message);}
}
function updateStat(){
  const n=db.cards.length;
  const parts=RARS.map(r=>r.name+"<b>"+db.cards.filter(c=>c.rar===r.id).length+"</b>").join(" ｜ ");

/* ============ 卡牌编辑弹窗 ============ */
function mkSelect(id,opts,sel){return "<select id='"+id+"'>"+opts.map(([v,t])=>"<option value='"+v+"'"+(String(sel)===String(v)?" selected":"")+">"+t+"</option>").join("")+"</select>";}
function mkMulti(id,sel){
  const opts=db.cards.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>"<label><input type='checkbox' value='"+x.id+"'"+(sel.indexOf(x.id)>=0?" checked":"")+">"+x.name+"</label>");
  return "<div class='mlist' id='"+id+"'>"+(opts.join("")||"<span style='color:var(--dim)'>（暂无卡牌）</span>")+"</div>";
}
function readMulti(id){return Array.prototype.map.call(el(id).querySelectorAll("input:checked"),i=>i.value);}
function closeModal(){el("mask").classList.remove("show");}
function renderParams(params){
  const box=el("paramBox");box.innerHTML="";
  const names=Object.keys(params||{});
  if(!names.length)box.innerHTML="<div style='color:var(--dim);font-size:12px'>暂无参数——用「＋ 新增参数」添加，并在描述里写 {参数名}</div>";
  names.forEach(n=>{
    const p=params[n]||{};
    const row=document.createElement("div");row.className="prow";
    row.innerHTML="<input class='pname' value='"+esc(n)+"'>"+
      "<input type='number' data-lv='1' value='"+(p[1]!==undefined?p[1]:"")+"'>"+
      "<input type='number' data-lv='2' value='"+(p[2]!==undefined?p[2]:"")+"'>"+
      "<input type='number' data-lv='3' value='"+(p[3]!==undefined?p[3]:"")+"'>"+
      "<button type='button' class='pdel'>✕</button>";
    row.querySelector(".pdel").onclick=()=>{row.remove();};
    box.appendChild(row);
  });
  el("btnAddParam").onclick=function(){
    const used=[];box.querySelectorAll(".pname").forEach(i=>used.push(i.value.trim()));
    let name="x";for(const c of"xyzαβγabc"){if(used.indexOf(c)<0){name=c;break;}}
    const row=document.createElement("div");row.className="prow";
    row.innerHTML="<input class='pname' value='"+name+"'>"+
      "<input type='number' data-lv='1' value=''><input type='number' data-lv='2' value=''><input type='number' data-lv='3' value=''>"+
      "<button type='button' class='pdel'>✕</button>";
    row.querySelector(".pdel").onclick=()=>{row.remove();};
    box.appendChild(row);
  };
}
function collectParams(){
  const params={};
  el("paramBox").querySelectorAll(".prow").forEach(row=>{
    const n=row.querySelector(".pname").value.trim();if(!n)return;
    params[n]={1:parseFloat(row.querySelector('[data-lv="1"]').value)||0,2:parseFloat(row.querySelector('[data-lv="2"]').value)||0,3:parseFloat(row.querySelector('[data-lv="3"]').value)||0};
  });
  return params;
}
function openModal(id){
  try{
    const c=id?cardById(id):null;
    if(id&&!c){toast("找不到该卡牌");return;}
    el("mTitle").textContent=c?"编辑："+c.name:"新增卡牌";
    const f=el("mForm");f.innerHTML="";
    const field=(label,html)=>'<div class="field"><label>'+label+'</label>'+html+'</div>';
    f.innerHTML=
      field("名称",'<input id="inpName" value="'+esc(c?c.name:"")+'">')+
      '<div class="grid3">'+
        field("类别",mkSelect("inpCat",Object.keys(CATS).map(k=>[k,CATS[k]]),c?c.cat:"attack"))+
        field("稀有度",mkSelect("inpRar",RARS.map(r=>[r.id,r.name]),c?c.rar:"green"))+
        field("等级",mkSelect("inpLv",[[1,"Lv1"],[2,"Lv2"],[3,"Lv3"]],c?(c.lv||1):1))+
      '</div>'+
      field("效果描述（用 {参数名} 引用数值，如：豆伤+{x}）",'<textarea id="inpDesc">'+esc(c?c.desc:"")+'</textarea>')+
      field("备注（你的要求 / 说明，纯文字）",'<textarea id="inpNote">'+esc(c?(c.note||""):"")+'</textarea>')+
      '<div class="field"><label>参数数值（按等级设置）</label><div id="paramBox"></div><button type="button" id="btnAddParam">＋ 新增参数</button></div>'+
      field("前置卡牌（需先拥有其一）",mkMulti("inpPre",c?(c.pre||[]):[]))+
      field("互斥卡牌（不可同时拥有）",mkMulti("inpMut",c?(c.mut||[]):[]))+
      '<div class="dbtn"><button type="button" class="ghost" id="btnCancel">取消</button><button type="button" id="btnSave">保存</button></div>';
    renderParams(c?(c.params||{}):{});
    el("btnCancel").onclick=closeModal;
    el("btnSave").onclick=function(){
      try{
        const name=el("inpName").value.trim();if(!name){toast("名称不能为空");return;}
        const cat=el("inpCat").value,rar=el("inpRar").value,lv=parseInt(el("inpLv").value,10)||1;
        const desc=el("inpDesc").value.trim(),params=collectParams();
        const note=el("inpNote").value.trim();
        if(c){c.name=name;c.cat=cat;c.rar=rar;c.lv=lv;c.desc=desc;c.params=params;c.note=note;}
        else{db.cards.push({id:"c_"+Date.now().toString(36),name,cat,rar,lv,params,desc,pre:[],mut:[],note});}
        save();render();closeModal();
      }catch(e){showErr("保存卡牌失败："+e.message);}
    };
    el("mask").classList.add("show");
  }catch(e){showErr("打开编辑失败："+e.message);}
}

function dropName(id){const d=db.drops[id];return d?d.name:id;}
function dropEditor(key){
  const m=db.monsters[key];
  const wrap=document.createElement("span");
  const paint=()=>{
    wrap.innerHTML="";
    (m.drops||[]).forEach((d,i)=>{
      const chip=document.createElement("span");
      chip.style.cssText="display:inline-flex;align-items:center;gap:4px;background:#20212f;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:2px 6px 2px 0;font-size:11px;color:#cfcbe6";
      chip.innerHTML=esc(dropName(d.id))+" ×"+d.count+" <a style='color:var(--red);cursor:pointer'>✕</a>";
      chip.querySelector("a").onclick=()=>{m.drops.splice(i,1);save();paint();};
      wrap.appendChild(chip);
    });
    const sel=document.createElement("select");
    sel.style.cssText="background:#101120;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px;font:inherit";
    Object.keys(db.drops).forEach(did=>{const o=document.createElement("option");o.value=did;o.textContent=db.drops[did].name;sel.appendChild(o);});
    const cnt=document.createElement("input");
    cnt.type="number";cnt.min=1;cnt.value=1;
    cnt.style.cssText="width:52px;background:#101120;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px;font:inherit";
    const add=document.createElement("button");add.type="button";add.className="madd";add.textContent="添加";
    add.style.padding="4px 10px";add.style.margin="0 0 0 6px";
    add.onclick=()=>{
      const did=sel.value,n=Math.max(1,parseInt(cnt.value,10)||1);
      const ex=m.drops.find(d=>d.id===did);
      if(ex)ex.count+=n;else m.drops.push({id:did,count:n});
      save();paint();
    };
    wrap.appendChild(sel);wrap.appendChild(cnt);wrap.appendChild(add);
  };
  paint();
  return wrap;
}
function renderMonRow(body,key){
  const m=db.monsters[key];
  const tr=document.createElement("tr");
  const num=(k)=>'<td><input class="narrow" type="number" step="any" data-k="'+k+'" value="'+(m[k]!==undefined?m[k]:"")+'"></td>';
  tr.innerHTML="<td><input type='text' data-k='name' value='"+esc(m.name)+"'></td>"+
    "<td><select data-k='kind'>"+Object.keys(KINDS).map(k=>"<option value='"+k+"'"+(m.kind===k?" selected":"")+">"+KINDS[k]+"</option>").join("")+"</select></td>"+
    num("hp")+num("speed")+num("r")+
    "<td><input type='text' data-k='split' value='"+esc(m.split||"")+"'></td>"+
    "<td><button type='button' class='del' data-del='"+key+"'>删</button></td>";
  const fields=(MON_FIELDS[m.kind]||[]);
  const cells=fields.map(f=>{
    const lbl={walk:"闲逛速",windup:"蓄力",chargeSpeed:"冲速",stun:"眩晕",fuse:"引信",boomR:"爆炸半径",eatTime:"进食",cadence:"间隔",telegraph:"前摇",bulletSpeed:"弹速"}[f]||f;
    return "<span style='margin-right:8px'>"+lbl+" <input type='number' step='any' data-k='"+f+"' value='"+(m[f]!==undefined?m[f]:"")+"' style='width:64px;background:#101120;border:1px solid var(--line);border-radius:5px;padding:3px;color:var(--fg)'></span>";
  }).join("");
  const extraDiv=document.createElement("tr");
  extraDiv.innerHTML="<td colspan='7' style='font-size:11px'>"+cells+"</td>";
  const dropTr=document.createElement("tr");
  dropTr.innerHTML="<td colspan='7' style='font-size:11px'>掉落物：</td>";
  dropTr.children[0].appendChild(dropEditor(key));
  body.appendChild(tr);
  body.appendChild(extraDiv);
  body.appendChild(dropTr);
  tr.querySelector('[data-k="kind"]').onchange=function(){m.kind=this.value;renderMonsters();save();};
  tr.querySelectorAll("input[data-k], select[data-k]").forEach(inp=>{
    inp.addEventListener("change",function(){
      const k=this.getAttribute("data-k");
      if(k==="name")m.name=this.value;

  });
  tr.querySelector("[data-del]").onclick=function(){
    if(!confirm("删除怪物「"+m.name+"」？"))return;
    delete db.monsters[key];renderMonsters();save();
  };
}

/* ============ 全局 ============ */
let toastT=null;
function toast(msg){const t=el("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},1600);}
function exportJSON(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="imsnake-balance.json";a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},500);
  toast("已导出 imsnake-balance.json（放入仓库或发给开发者）");
}
function importJSON(file){
  const r=new FileReader();
  r.onload=function(){
    try{
      const j=JSON.parse(r.result);
      if(!Array.isArray(j.cards))throw new Error("缺少 cards 数组");
      db=j;db.cards=db.cards.map(migrateCard);
      db.snake=Object.assign({},DEFAULT_SNAKE,db.snake||{});
      db.monsters=migrateMonsters(Object.assign({},DEFAULT_MONSTERS,db.monsters||{}));
      db.npcs=Object.assign({},DEFAULT_NPCS,db.npcs||{});
      db.drops=Object.assign({},DEFAULT_DROPS,db.drops||{});
      delete db.interact;
      save();renderAll();
      toast("导入成功 ("+db.cards.length+" 张卡)");
    }catch(e){toast("导入失败："+e.message);}
  };
  r.readAsText(file);
}
function renderAll(){render();renderSnake();renderMonsters();renderNpcs();renderDrops();}

el("btnAdd").onclick=function(){openModal(null);};
el("btnExport").onclick=exportJSON;
el("btnImport").onclick=function(){el("fileImport").click();};
el("fileImport").onchange=function(e){if(e.target.files[0])importJSON(e.target.files[0]);e.target.value="";};
el("btnReset").onclick=function(){
  if(!confirm("恢复默认配置？当前所有编辑会丢失。"))return;
  db={meta:{version:5,note:""},cards:JSON.parse(JSON.stringify(DEFAULT_CARDS)),snake:Object.assign({},DEFAULT_SNAKE),monsters:Object.assign({},DEFAULT_MONSTERS),npcs:Object.assign({},DEFAULT_NPCS),drops:Object.assign({},DEFAULT_DROPS)};
  save();renderAll();
};
Object.keys(CATS).forEach(function(k){el("fCat").insertAdjacentHTML("beforeend","<option value='"+k+"'>"+CATS[k]+"</option>");});
RARS.forEach(function(r){el("fRar").insertAdjacentHTML("beforeend","<option value='"+r.id+"'>"+r.name+"</option>");});
["fCat","fRar","fLv"].forEach(function(id){el(id).addEventListener("change",render);});
el("fSearch").addEventListener("input",render);
el("mask").addEventListener("click",function(e){if(e.target===el("mask"))closeModal();});
el("tabs").addEventListener("click",function(e){
  const b=e.target.closest("[data-tab]");if(!b)return;
  el("tabs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  const tab=b.getAttribute("data-tab");
  ["cards","snake","monsters","npcs","drops"].forEach(t=>el("sec-"+t).classList.toggle("on",t===tab));
  document.querySelectorAll("[data-in-cards]").forEach(x=>x.style.display=(tab==="cards"?"":"none"));
});

load();renderAll();
</script>
</body>
</html>
